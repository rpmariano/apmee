<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>APMEE EB Cobre</title>
    <script type="text/javascript">
      // SPA redirect hack for GitHub Pages
      // Preserves the path so React Router can handle it
      // Based on: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // Keep 1 segment for repo name (e.g., /apmee-app/)

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
